name: Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: SwiftLint (strict)
        run: swiftlint lint --quiet --strict

  test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Show Swift version
        run: swift --version

      - name: Build
        run: swift build

      - name: Run tests
        run: swift test

  xcode-build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Xcode Debug build (warnings = errors)
        run: |
          xcodebuild \
            -project EMLViewer.xcodeproj \
            -scheme EMLViewer \
            -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            CODE_SIGN_STYLE=- \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build
