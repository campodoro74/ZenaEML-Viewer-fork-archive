name: Update Homebrew Cask

on:
  release:
    types: [published]

jobs:
  update-cask:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Download release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release download "${{ github.event.release.tag_name }}" -p "EMLViewer.app.zip"

      - name: Update cask formula
        run: |
          VERSION="${{ github.event.release.tag_name }}"
          VERSION="${VERSION#v}"
          SHA=$(shasum -a 256 EMLViewer.app.zip | awk '{print $1}')
          echo "version=$VERSION"
          echo "sha256=$SHA"
          sed -i "s/version \".*\"/version \"$VERSION\"/" Casks/emlviewer.rb
          sed -i "s/sha256 \".*\"/sha256 \"$SHA\"/" Casks/emlviewer.rb
          cat Casks/emlviewer.rb

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet Casks/emlviewer.rb; then
            echo "No cask changes."
            exit 0
          fi
          git add Casks/emlviewer.rb
          git commit -m "Update cask to ${{ github.event.release.tag_name }}"
          git push origin master
