name: EMLViewer
options:
  bundleIdPrefix: com.noma4i
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  minimumXcodeGenVersion: "2.40.0"
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: "34ZTAW54JD"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: minimal
    CODE_SIGN_STYLE: Automatic
    PRODUCT_NAME: "$(TARGET_NAME)"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ENABLE_HARDENED_RUNTIME: YES

targets:
  EMLCore:
    type: framework.static
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Sources/EMLCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.noma4i.EMLCore
        DEFINES_MODULE: YES
        SKIP_INSTALL: YES
        GENERATE_INFOPLIST_FILE: YES

  EMLViewer:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Sources/EMLViewer
    resources:
      - path: Resources/AppIcon.icns
      - path: Sources/EMLViewer/Resources/github.png
    dependencies:
      - target: EMLCore
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.noma4i.EMLViewer
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Resources/Info.plist
        COMBINE_HIDPI_IMAGES: YES
        CODE_SIGN_ENTITLEMENTS: Resources/EMLViewer-AppStore.entitlements
        LD_RUNPATH_SEARCH_PATHS:
          - "@executable_path/../Frameworks"

  emlcheck:
    type: tool
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Sources/emlcheck
    dependencies:
      - target: EMLCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.noma4i.emlviewer

  EMLCoreTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Tests/EMLCoreTests
    resources:
      - path: Tests/EMLCoreTests/Fixtures
    dependencies:
      - target: EMLCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.noma4i.EMLCoreTests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  EMLViewer:
    build:
      targets:
        EMLViewer: all
        EMLCore: all
        emlcheck: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - EMLCoreTests
    archive:
      config: Release
    profile:
      config: Release
    analyze:
      config: Debug
